# ==============================================================================
# config.mouse.yaml - Pipeline Configuration for Mouse (GRCm39) samples
# ==============================================================================
# Pre-configured for mouse RNA-seq analysis using GENCODE vM33 annotations
#
# Usage:
#   ./run_pipeline.sh -i data/fastq/ -o results/ -c config/config.mouse.yaml \
#       -m config/samples.tsv
#
# ==============================================================================

# ==============================================================================
# REFERENCE FILES
# ==============================================================================
reference:
  # Ensembl GRCm39 release 114 primary assembly + 92 ERCC spike-ins. This is
  # the reference the Plasmidsaurus portal uses (its BAM @SQ lines match this
  # FASTA exactly). Paths are relative to the repository root.
  genome_fasta: "data/reference/Mus_musculus.GRCm39.114_ERCC.fa"

  # Ensembl 114 gene annotation + ERCC92
  gtf: "data/reference/Mus_musculus.GRCm39.114_ERCC.gtf"

  # STAR index built from the two files above (STAR defaults, sjdbOverhang 100)
  star_index: "data/reference/Mus_musculus.GRCm39.114_ERCC.STAR"

  # BED12 gene model for RSeQC, made from the GTF with UCSC
  # gtfToGenePred -genePredExt | genePredToBed
  gene_model_bed: "data/reference/Mus_musculus.GRCm39.114_ERCC.bed12"

  # Organism for functional enrichment
  organism: "mouse"

# ==============================================================================
# INPUT/OUTPUT PATHS
# ==============================================================================
paths:
  input_dir: "data/fastq"
  output_dir: "results"
  log_dir: "logs"

# ==============================================================================
# SAMPLE INFORMATION
# ==============================================================================
samples:
  metadata: "config/samples.tsv"
  # Informational only: the pipeline detects paired-end input from R2 files.
  # Plasmidsaurus RNA-seq is single-end.
  paired_end: false

# ==============================================================================
# FASTP - READ FILTERING
# ==============================================================================
fastp:
  qualified_quality_phred: 15
  length_required: 50
  trim_poly_x: true
  threads: 8

# ==============================================================================
# STAR - ALIGNMENT
# ==============================================================================
star:
  threads: 16
  # Fixed in scripts/02_align.sh (not read from this file): STAR defaults plus
  # --outFilterIntronMotifs RemoveNoncanonical, --outReadsUnmapped Fastx and
  # --outSAMattributes NH HI AS nM NM MD. This is the Plasmidsaurus portal's
  # command; adding ENCODE-style filters breaks concordance with the portal.
  outFilterIntronMotifs: "RemoveNoncanonical"
  outReadsUnmapped: "Fastx"

# ==============================================================================
# FEATURECOUNTS - QUANTIFICATION
# ==============================================================================
featurecounts:
  # Only "strand" is read from this file; the rest are the defaults in
  # scripts/07_quantify.sh, listed for reference. They reproduce the portal
  # count matrix exactly: whole gene bodies, forward strand, multi-mappers
  # split fractionally.
  feature_type: "gene"
  attribute_type: "gene_id"
  strand: 1  # Forward stranded (Plasmidsaurus libraries; verified on LJQQSK)
  count_multimapping: true
  fraction: true
  # Must stay 0: STAR gives multi-mappers MAPQ 0-3, so any higher value drops
  # them all
  min_mapping_quality: 0
  threads: 8

# ==============================================================================
# EDGER - DIFFERENTIAL EXPRESSION
# ==============================================================================
edger:
  min_count: 10
  fdr_threshold: 0.05
  lfc_threshold: 1.0
  # Define your contrast here (format: treatment-control)
  contrast: "LIPA-US"

# ==============================================================================
# GSEAPY - FUNCTIONAL ENRICHMENT
# ==============================================================================
gsea:
  gene_sets:
    - "MSigDB_Hallmark_2020"
  min_size: 15
  max_size: 500
  permutation_num: 1000
  fdr_threshold: 0.25
